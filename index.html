<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德语词卡 · 按词族记单词</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot"><div class="boot-in"><div class="boot-mark">Wortschatz</div><p>正在载入词库…</p></div></div>
<div id="app">

  <!-- ============ 左侧导航（多邻国式） ============ -->
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true">
        <path d="M20 36 V20 M20 24 L9 12 M20 22 L31 9 M20 28 L12 20 M20 26 L29 18" stroke="#3f7d20" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="9" cy="12" r="4" fill="#7ec850"/><circle cx="31" cy="9" r="4" fill="#7ec850"/>
        <circle cx="12" cy="20" r="3.4" fill="#a8db78"/><circle cx="29" cy="18" r="3.4" fill="#a8db78"/>
        <circle cx="20" cy="7" r="4.5" fill="#58a700"/>
      </svg>
      <div><div class="brand-name">德语词卡</div><div class="brand-sub">Wortschatz</div></div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="study">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h7"/></svg>
        <span>背单词</span></button>
      <button class="nav-item" data-view="path">
        <svg viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.5"/><circle cx="17" cy="12" r="2.5"/><circle cx="7" cy="18" r="2.5"/><path d="M9.5 6c4 0 3 6 5 6M17 14.5c-4 0-5 3.5-7.5 3.5"/></svg>
        <span>闯关路径</span></button>
      <button class="nav-item" data-view="quiz">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 2.8c-.8.5-1 1-1 2M12 17v.5"/></svg>
        <span>测验</span></button>
      <button class="nav-item" data-view="search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <span>查找</span></button>
    </nav>

    <div class="side-foot">
      <div class="side-label">今日目标</div>
      <div class="goal-bar"><div class="goal-fill" id="sideGoalFill"></div></div>
      <div class="side-goal-text"><b id="sideDone">0</b> / <span id="sideGoal">20</span> 词</div>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <div class="main">
    <header class="topbar">
      <div class="top-left">
        <span class="chip" id="chipBranch">背单词</span>
        <span class="top-hint" id="topHint">空格翻面 · F 朗读 · 1/2/3 评级</span>
      </div>
      <div class="top-stats">
        <div class="stat" title="连续学习天数"><span class="stat-ico fire">▲</span><b id="statStreak">1</b><small>天</small></div>
        <div class="stat" title="经验值"><span class="stat-ico xp">◆</span><b id="statXp">0</b><small>XP</small></div>
        <div class="stat" title="已掌握"><span class="stat-ico leaf">●</span><b id="statKnown">0</b><small>已掌握</small></div>
      </div>
    </header>

    <div class="content">

      <!-- ---- 视图 2：背单词 ---- -->
      <section class="view active" id="view-study">
        <div class="study-head">
          <div class="scope-bar" id="scopeBar">
            <div class="scope-row" id="scopeMain"></div>
            <div class="scope-row" id="scopeBranch"></div>
            <div class="scope-row fam" id="scopeFam" hidden></div>
          </div>
          <div class="study-progress">
            <div class="sp-line"><span id="spLabel">准备开始</span><b id="spCount">0 / 0</b></div>
            <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
          </div>
          <button class="btn-main" id="btnNewRound">换一组</button>
        </div>
        <div class="card-stage">
          <div class="flashcard" id="flashcard">
            <div class="fc-inner">
            <div class="fc-front" id="fcFront">
              <div class="fc-pos" id="fcPos"></div>
              <div class="fc-art" id="fcArt"></div>
              <div class="fc-word" id="fcWord">—</div>
              <div class="fc-ipa" id="fcIpa"></div>
              <button class="speak" id="btnSpeak" title="朗读（F）">
                <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
                朗读</button>
              <div class="fc-tap">点击卡片 · 空格键翻面</div>
            </div>
            <div class="fc-back" id="fcBack">
              <div class="fb-scroll" id="fbScroll"></div>
            </div>
            </div>
          </div>
          <div class="rate-row" id="rateRow">
            <button class="rate r1" data-rate="0"><b>不认识</b><small>1 · 稍后再来</small></button>
            <button class="rate r2" data-rate="1"><b>模糊</b><small>2 · 明天复习</small></button>
            <button class="rate r3" data-rate="2"><b>认识</b><small>3 · 已掌握</small></button>
          </div>
          <div class="key-hint">空格 翻面　·　F 朗读　·　1 / 2 / 3 评级</div>
        </div>
      </section>

      <!-- ---- 视图 3：闯关路径 ---- -->
      <section class="view" id="view-path">
        <div class="path-head">
          <div><h2>词族闯关</h2><p>按词族一组一组地学，完成当前关卡即可解锁下一族。</p></div>
          <div class="path-xp"><b id="pathXp">0</b> XP</div>
        </div>
        <div class="path-scroll" id="pathScroll"><div class="path-track" id="pathTrack"></div></div>
      </section>

      <!-- ---- 视图 4：测验 ---- -->
      <section class="view" id="view-quiz">
        <div class="quiz-wrap" id="quizWrap"></div>
      </section>

      <!-- ---- 视图 5：查找 ---- -->
      <section class="view" id="view-search">
        <div class="search-wrap">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
            <input id="searchInput" type="text" placeholder="输入德语、中文、英文或词根，例如 ver- / 环境 / Umwelt" autocomplete="off">
            <span class="search-count" id="searchCount"></span>
          </div>
          <div class="search-filters" id="searchFilters"></div>
          <div class="search-list" id="searchList"></div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- 单词详情弹层 -->
<div class="modal-mask" id="wordModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<script src="data/words.js"></script>
<script src="app.js"></script>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b){b.classList.add('gone');setTimeout(function(){b.remove();},420);}},6000);</script>
</body>
</html>
